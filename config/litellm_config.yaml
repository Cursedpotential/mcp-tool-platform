# ============================================================================
# General Settings
# ============================================================================
general_settings: 
  master_key: ${LITELLM_MASTER_KEY}

litellm_settings:
  # Cache settings
  cache: true
  cache_type: redis
  redis_host: redis
  redis_port: 6379
  redis_password: ${REDIS_PASSWORD}
  
  # Completion settings
  drop_params: true
  always_alternate_model_names:
    - gpt-4o
    - claude-sonnet-4-20250514
  
  # Timeout settings
  request_timeout: 600
  max_retries: 3
  
  # Logging
  detailed_logs: true

# ============================================================================
# Model Routing Rules
# ============================================================================
model_alias_map:
  # Cost-based routing
  "cheap": "gpt-4o-mini"
  "fast": "llama-3.1-8b-instant"
  "smart": "claude-opus-4-20250514"
  "reasoning": "llama-3.1-70b-versatile"
  
  # Task-based routing
  "embedding": "text-embedding-ada-002"
  "analysis": "claude-opus-4-20250514"
  "coding": "claude-sonnet-4-20250514"
  "quick": "gpt-4o-mini"

# ============================================================================
# Expected Models for MCP Tools
# ============================================================================
# These are the models the MCP tool registry will use
expected_models:
  - gpt-4o
  - gpt-4o-mini
  - claude-sonnet-4-20250514
  - claude-opus-4-20250514
  - gemini-pro
  - llama-3.1-70b-versatile
