version: '3.8'

# ============================================================================
# MCP Tool Platform - VPS Production Deployment
# Host: salem-nexus (Storage) + salem-forge (Compute)
# ============================================================================

services:
  # ============================================================================
  # PostgreSQL + PGVector + PostGIS - Main Database
  # ============================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: salem-postgres
    hostname: salem-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-salem}
      - POSTGRES_USER=${POSTGRES_USER:-salem_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --locale=C
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    command: >
      postgres
        -c shared_preload_libraries=vector
        -c max_connections=200
        -c shared_buffers=256MB
        -c effective_cache_size=1GB
        -c maintenance_work_mem=64MB
        -c checkpoint_completion_target=0.9
        -c wal_buffers=16MB
        -c default_statistics_target=100
        -c random_page_cost=1.1
        -c effective_io_concurrency=200
        -c work_mem=16MB
        -c min_wal_size=1GB
        -c max_wal_size=4GB
    restart: unless-stopped
    networks:
      - salem-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-salem_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "salem.service=database"
      - "salem.role=primary"

  # ============================================================================
  # Redis - Caching & Job Queues
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: salem-redis
    hostname: salem-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    restart: unless-stopped
    networks:
      - salem-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "salem.service=cache"

  # ============================================================================
  # Neo4j - Graph Database for Relationships (Aura or Self-hosted)
  # ============================================================================
  neo4j:
    image: neo4j:5.15-community
    container_name: salem-neo4j
    hostname: salem-neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=2G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    restart: unless-stopped
    networks:
      - salem-network
    labels:
      - "salem.service=graph"

  # ============================================================================
  # Chroma - Short-term Vector Storage (72hr TTL)
  # ============================================================================
  chroma:
    image: chromadb/chroma:latest
    container_name: salem-chroma
    hostname: salem-chroma
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - CHROMA_SERVER_AUTH_CREDENTIALS_PROVIDER=chromadb.auth.token.TokenConfigServerAuthCredentialsProvider
      - CHROMA_SERVER_AUTH_TOKEN_TRANSPORT_HEADER=X-Chroma-Token
      - CHROMA_SERVER_AUTH_CREDENTIALS=${CHROMA_AUTH_TOKEN}
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped
    networks:
      - salem-network
    labels:
      - "salem.service=vector"
      - "salem.role=short-term"

  # ============================================================================
  # LiteLLM - Universal LLM Proxy/Gateway
  # ============================================================================
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: salem-litellm
    hostname: salem-litellm
    ports:
      - "4000:4000"
    environment:
      # Database for cost tracking
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      # Master key for authentication
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      # Enable features
      - LITELLM_LOG=INFO
      - LITELLM_DROP_PARAMS=true
      # Redis for caching
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      # Model API keys (add your keys here)
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - COHERE_API_KEY=${COHERE_API_KEY}
      - AZURE_API_KEY=${AZURE_OPENAI_API_KEY}
      - AZURE_API_BASE=${AZURE_OPENAI_ENDPOINT}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - TOGETHER_API_KEY=${TOGETHER_API_KEY}
      - REPLICATE_API_KEY=${REPLICATE_API_KEY}
      - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY}
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
    command: --config /app/config.yaml --port 4000 --num_workers 4
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - salem-network
    labels:
      - "salem.service=llm-proxy"
      - "salem.role=router"

  # ============================================================================
  # MetaMCP Internal - Platform Service Access (Port 4001)
  # ============================================================================
  metamcp-internal:
    build:
      context: .
      dockerfile: Dockerfile.metamcp
    container_name: salem-metamcp-internal
    hostname: salem-metamcp-internal
    ports:
      - "4001:4001"
    environment:
      - PORT=4001
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - MCP_REGISTRY_URL=https://mcp.run/registry
      - INTERNAL_MODE=true
    volumes:
      - ./server/mcp:/app/mcp
      - metamcp_data:/app/data
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - salem-network
    labels:
      - "salem.service=mcp"
      - "salem.role=internal"

  # ============================================================================
  # MetaMCP External - Client Tool Exposure (Port 4002)
  # ============================================================================
  metamcp-external:
    build:
      context: .
      dockerfile: Dockerfile.metamcp
    container_name: salem-metamcp-external
    hostname: salem-metamcp-external
    ports:
      - "4002:4002"
    environment:
      - PORT=4002
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - MCP_REGISTRY_URL=https://mcp.run/registry
      - EXTERNAL_MODE=true
      - API_KEY_AUTH=required
    volumes:
      - ./server/mcp:/app/mcp
      - metamcp_external_data:/app/data
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - salem-network
    labels:
      - "salem.service=mcp"
      - "salem.role=external"

  # ============================================================================
  # Directus - Headless CMS for File Management
  # ============================================================================
  directus:
    image: directus/directus:latest
    container_name: salem-directus
    hostname: salem-directus
    ports:
      - "8055:8055"
    environment:
      - DB_CLIENT=pg
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${POSTGRES_DB:-salem}
      - DB_USER=${POSTGRES_USER:-salem_user}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - ADMIN_EMAIL=${DIRECTUS_ADMIN_EMAIL}
      - ADMIN_PASSWORD=${DIRECTUS_ADMIN_PASSWORD}
      - KEY=${DIRECTUS_KEY}
      - SECRET=${DIRECTUS_SECRET}
      - STORAGE_LOCATIONS=local
      - STORAGE_LOCAL_ROOT=/directus/uploads
      - PUBLIC_URL=${DIRECTUS_PUBLIC_URL:-http://localhost:8055}
      - MAX_PAYLOAD_SIZE=100mb
      - CACHE_ENABLED=true
      - CACHE_STORE=redis
      - REDIS=redis://:${REDIS_PASSWORD}@redis:6379
    volumes:
      - directus_data:/directus/uploads
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - salem-network
    labels:
      - "salem.service=cms"

  # ============================================================================
  # Main Application - Platform API & Frontend
  # ============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: salem-app
    hostname: salem-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Database
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      # Redis
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      # Neo4j
      - NEO4J_URL=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      # Chroma
      - CHROMA_URL=http://chroma:8000
      - CHROMA_AUTH_TOKEN=${CHROMA_AUTH_TOKEN}
      # LiteLLM
      - LITELLM_URL=http://litellm:4000
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      # MetaMCP
      - METAMCP_URL=http://metamcp-internal:4001
      # Directus
      - DIRECTUS_URL=http://directus:8055
      - DIRECTUS_TOKEN=${DIRECTUS_TOKEN}
      # Security
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - JWT_SECRET=${JWT_SECRET}
      # External services
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - app_data:/app/.data
      - ./uploads:/app/uploads
    depends_on:
      - postgres
      - redis
      - neo4j
      - chroma
      - litellm
      - metamcp-internal
      - directus
    restart: unless-stopped
    networks:
      - salem-network
    labels:
      - "salem.service=app"
      - "salem.role=primary"

  # ============================================================================
  # Kasm Workspace - CLI Tools & Remote Desktop
  # ============================================================================
  kasm-workspace:
    image: kasmweb/debian-bookworm-desktop:1.15.0
    container_name: salem-kasm-workspace
    hostname: salem-kasm-workspace
    ports:
      - "6901:6901"  # VNC web interface
    environment:
      - VNC_PW=${KASM_VNC_PASSWORD}
      - VNC_RESOLUTION=1920x1080
      - VNC_COL_DEPTH=24
    volumes:
      - kasm_home:/home/kasm-user
      - kasm_config:/home/kasm-user/.config
      - ./scripts:/scripts:ro
      - ./data:/data
      - kasm_tools:/opt/tools
    shm_size: 2gb
    restart: unless-stopped
    networks:
      - salem-network
    labels:
      - "salem.service=workspace"
      - "salem.role=cli-tools"

  # ============================================================================
  # Jupyter Lab - Python Notebooks for Analysis
  # ============================================================================
  jupyter:
    image: jupyter/scipy-notebook:latest
    container_name: salem-jupyter
    hostname: salem-jupyter
    ports:
      - "8888:8888"
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - JUPYTER_TOKEN=${JUPYTER_TOKEN}
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./data:/home/jovyan/data
      - jupyter_config:/home/jovyan/.jupyter
    restart: unless-stopped
    networks:
      - salem-network
    labels:
      - "salem.service=notebooks"

  # ============================================================================
  # n8n - Workflow Automation
  # ============================================================================
  n8n:
    image: n8nio/n8n:latest
    container_name: salem-n8n
    hostname: salem-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=America/New_York
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-salem}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-salem_user}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - n8n_data:/home/node/.n8n
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    networks:
      - salem-network
    labels:
      - "salem.service=automation"

  # ============================================================================
  # Traefik - Reverse Proxy & SSL (Optional)
  # ============================================================================
  traefik:
    image: traefik:v3.0
    container_name: salem-traefik
    hostname: salem-traefik
    ports:
      - "80:80"      # HTTP
      - "443:443"    # HTTPS
      - "443:443/udp" # HTTP/3
    command:
      - "--providers.docker=true"
      - "--providers.docker.network=salem-network"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--log.level=INFO"
    volumes:
      - traefik_data:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    networks:
      - salem-network
    labels:
      - "salem.service=proxy"

volumes:
  # Database
  postgres_data:
  redis_data:
  
  # Graph Database
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
  
  # Vector Storage
  chroma_data:
  
  # Application Data
  app_data:
  directus_data:
  
  # Workspace
  kasm_home:
  kasm_config:
  kasm_tools:
  
  # Tools
  jupyter_config:
  n8n_data:
  
  # Configuration
  traefik_data:
  metamcp_data:
  metamcp_external_data:

networks:
  salem-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ============================================================================
# DEPLOYMENT INSTRUCTIONS
# ============================================================================
#
# 1. Copy this file to docker-compose.yml on your VPS
# 2. Copy .env.postgres.example to .env and fill in all values
# 3. Run: docker-compose up -d
# 4. Check logs: docker-compose logs -f
#
# Access Points (after deployment):
# - App: http://localhost:3000
# - Directus: http://localhost:8055
# - Kasm Workspace: http://localhost:6901
# - Jupyter: http://localhost:8888
# - n8n: http://localhost:5678
# - LiteLLM Proxy: http://localhost:4000
# - MetaMCP Internal: http://localhost:4001
# - MetaMCP External: http://localhost:4002
# - Traefik Dashboard: http://localhost:8080 (if enabled)
#
# ============================================================================